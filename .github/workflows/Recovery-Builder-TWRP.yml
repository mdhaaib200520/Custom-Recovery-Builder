name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11

      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: ''

      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'twrp-12.1'

      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/lake'

      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'lake'

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    env:
      GITHUB_TOKEN: ${{ secrets.TEST }}

    permissions:
      contents: write

    steps:

      - name: Check Out
        uses: actions/checkout@v4

      - name: Display Inputs
        run: |
          echo "Displaying variables/inputs."
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
          echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}image"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf \
            gcc-multilib \
            gcc-10-multilib \
            g++-multilib \
            g++-10-multilib \
            libc6-dev \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            tree \
            lib32z-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            bc \
            ccache \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            build-essential \
            libgtk-3-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            git \
            libxml2 \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            imagemagick \
            libbz2-dev \
            lzma \
            ncftp \
            qemu-user-static \
            libstdc++-10-dev \
            libncurses6 \
            python3 \
            tar

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Git-Repo
        run: |
          mkdir -p ~/bin

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo

          chmod a+x ~/bin/repo

          sudo ln -sf ~/bin/repo /usr/bin/repo

          repo --version

      - name: Check Manifest Branch
        uses: haya14busa/action-cond@v1
        id: manifest
        with:
          cond: ${{ inputs.MANIFEST_BRANCH == 'twrp-11' || inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

      - name: Initialize Repo
        run: |
          mkdir -p android-recovery
          cd android-recovery

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          repo init \
            --depth=1 \
            -u "${{ steps.manifest.outputs.value }}" \
            -b "${{ inputs.MANIFEST_BRANCH }}"

      - name: Repo Sync
        run: |
          cd android-recovery

          repo sync \
            -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      # ============================================================
      # FIX system_dlkm
      #
      # The TWRP build validator currently accepts:
      #
      # system vendor product system_ext odm vendor_dlkm odm_dlkm
      #
      # Lake also uses system_dlkm.
      #
      # This step patches the validator in build/make/core/config.mk
      # before lunch/dumpvars is executed.
      # ============================================================

      - name: Fix system_dlkm Validator
        run: |
          cd android-recovery

          CONFIG="build/make/core/config.mk"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found!"
            exit 1
          fi

          echo "=============================================="
          echo "config.mk BEFORE system_dlkm patch"
          echo "=============================================="

          nl -ba "$CONFIG" | sed -n '895,915p'

          echo ""
          echo "=============================================="
          echo "Patching system_dlkm validator"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("build/make/core/config.mk")
          text = path.read_text()

          # Exact list shown in the build error:
          #
          # system vendor product system_ext odm vendor_dlkm odm_dlkm
          #
          # \s+ also handles Makefile line continuations/newlines.

          pattern = re.compile(
              r"system\s+"
              r"vendor\s+"
              r"product\s+"
              r"system_ext\s+"
              r"odm\s+"
              r"vendor_dlkm\s+"
              r"odm_dlkm"
          )

          matches = list(pattern.finditer(text))

          print(f"Found {len(matches)} matching partition list(s).")

          if not matches:
              print("")
              print("ERROR: Could not find the validator list.")
              print("")
              print("===== config.mk 895-915 =====")

              for number, line in enumerate(text.splitlines(), 1):
                  if 895 <= number <= 915:
                      print(f"{number}: {line}")

              print("==============================")
              raise SystemExit(1)

          replacement = (
              "system vendor product system_ext odm "
              "vendor_dlkm odm_dlkm system_dlkm"
          )

          text, count = pattern.subn(replacement, text)

          path.write_text(text)

          print("")
          print(f"Patched {count} occurrence(s).")
          print("system_dlkm has been added to the valid partition list.")
          PY

          echo ""
          echo "=============================================="
          echo "config.mk AFTER system_dlkm patch"
          echo "=============================================="

          nl -ba "$CONFIG" | sed -n '895,915p'

          echo ""
          echo "Checking system_dlkm:"
          grep -n "system_dlkm" "$CONFIG" || true

      - name: Clone Device Tree
        run: |
          cd android-recovery

          if [ -z "${{ inputs.DEVICE_TREE }}" ]; then
            echo "ERROR: DEVICE_TREE is empty!"
            echo "Enter your Lake device tree URL."
            exit 1
          fi

          echo "Cloning device tree:"
          echo "${{ inputs.DEVICE_TREE }}"

          echo "Branch:"
          echo "${{ inputs.DEVICE_TREE_BRANCH }}"

          echo "Path:"
          echo "${{ inputs.DEVICE_PATH }}"

          git clone \
            "${{ inputs.DEVICE_TREE }}" \
            -b "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_PATH }}"

          cd "${{ inputs.DEVICE_PATH }}"

          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          echo ""
          echo "Device tree commit:"
          git rev-parse HEAD

      - name: Check Build Makefile
        run: |
          cd android-recovery

          echo "Checking recovery makefile..."

          if [ -f "${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk" ]; then

            echo "Found:"
            echo "${{ inputs.DEVICE_PATH }}/twrp_${{ inputs.DEVICE_NAME }}.mk"

            echo "DEVICE_MAKEFILE=twrp_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          elif [ -f "${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk" ]; then

            echo "Found:"
            echo "${{ inputs.DEVICE_PATH }}/omni_${{ inputs.DEVICE_NAME }}.mk"

            echo "DEVICE_MAKEFILE=omni_${{ inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"

          else

            echo "ERROR: No recovery makefile found!"

            echo ""
            echo "Files in device tree:"
            find "${{ inputs.DEVICE_PATH }}" -maxdepth 2 -type f | sort

            exit 1
          fi

          echo ""
          echo "Using makefile:"
          echo "$DEVICE_MAKEFILE"

      - name: Check Device Tree Configuration
        run: |
          cd android-recovery

          echo "=============================================="
          echo "Device Configuration"
          echo "=============================================="

          echo "Device: ${{ inputs.DEVICE_NAME }}"
          echo "Path: ${{ inputs.DEVICE_PATH }}"
          echo "Target: ${{ inputs.BUILD_TARGET }}"
          echo "Manifest: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Makefile: ${{ env.DEVICE_MAKEFILE }}"

          echo ""
          echo "Checking system_dlkm references..."

          grep -Rni \
            --exclude-dir=.git \
            "system_dlkm" \
            "${{ inputs.DEVICE_PATH }}" \
            2>/dev/null || true

      - name: Building Image
        run: |
          cd android-recovery

          echo "=============================================="
          echo "Starting TWRP Build"
          echo "=============================================="

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo ""
          echo "Using lunch target:"
          echo "${{ env.DEVICE_MAKEFILE }}-eng"

          lunch "${{ env.DEVICE_MAKEFILE }}-eng"

          echo ""
          echo "Cleaning previous build..."
          make clean

          echo ""
          echo "Building:"
          echo "${{ inputs.BUILD_TARGET }}image"

          make "${{ inputs.BUILD_TARGET }}image" \
            -j$(nproc --all)

          echo ""
          echo "=============================================="
          echo "BUILD COMPLETED"
          echo "=============================================="

          echo "Output:"
          echo "out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img"

      - name: Verify Build Output
        run: |
          cd android-recovery

          OUTPUT_DIR="out/target/product/${{ inputs.DEVICE_NAME }}"

          echo "Checking build output:"
          echo "$OUTPUT_DIR"

          if [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            IMAGE="$OUTPUT_DIR/vendor_boot.img"
          else
            IMAGE="$OUTPUT_DIR/${{ inputs.BUILD_TARGET }}.img"
          fi

          if [ ! -f "$IMAGE" ]; then
            echo ""
            echo "ERROR: Build image was not created!"
            echo ""
            echo "Output directory:"
            ls -lah "$OUTPUT_DIR" || true
            exit 1
          fi

          echo ""
          echo "BUILD IMAGE FOUND:"
          ls -lh "$IMAGE"

      - name: Set Other Build Properties
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "VENDOR=$(echo "${{ inputs.DEVICE_PATH }}" | cut -d'/' -f2)" >> "$GITHUB_ENV"

      - name: Compressing TWRP Build (if Samsung)
        if: env.VENDOR == 'samsung'
        run: |
          cd "android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}"

          if [ "${{ inputs.BUILD_TARGET }}" = "boot" ] || \
             [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then

            echo "Compressing ${{ inputs.BUILD_TARGET }}.img"

            tar -cvf \
              "${{ inputs.BUILD_TARGET }}.tar" \
              "${{ inputs.BUILD_TARGET }}.img"

          elif [ "${{ inputs.BUILD_TARGET }}" = "vendorboot" ]; then

            echo "Compressing vendor_boot.img"

            tar -cvf \
              vendor_boot.tar \
              vendor_boot.img

          else

            echo "Unknown build target. Skipping tar..."

          fi

      - name: Upload to Release (boot and recovery)
        if: inputs.BUILD_TARGET == 'boot' || inputs.BUILD_TARGET == 'recovery'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.*
          name: Unofficial TWRP for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}

            Branch:
            ${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ env.COMMIT_ID }}

      - name: Upload to Release (vendor_boot)
        if: inputs.BUILD_TARGET == 'vendorboot'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.*
          name: Unofficial TWRP for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ inputs.MANIFEST_BRANCH }}

            Device Tree:
            ${{ inputs.DEVICE_TREE }}

            Branch: ${{ inputs.DEVICE_TREE_BRANCH }}

            Commit:
            ${{ env.COMMIT_ID }}

      - name: Run LDCheck
        run: |
          RECOVERY_ROOT="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ inputs.DEVICE_NAME }}/recovery/root"

          echo "Creating recovery root directory..."
          mkdir -p "$RECOVERY_ROOT"

          if [ ! -d "tools" ]; then
            echo "ERROR: tools directory not found!"
            exit 1
          fi

          cd tools

          if [ -f "libneeds" ]; then
            mv -n libneeds "$RECOVERY_ROOT/" || true
          fi

          if [ -f "ldcheck" ]; then
            mv -n ldcheck "$RECOVERY_ROOT/" || true
          fi

          cd "$RECOVERY_ROOT"

          if [ ! -f "ldcheck" ]; then
            echo "ldcheck not available. Skipping LDCheck."
            exit 0
          fi

          if [ ! -f "libneeds" ]; then
            echo "libneeds not available. Skipping LDCheck."
            exit 0
          fi

          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ inputs.LDCHECK }}"

          echo "Done checking missing dependencies. Review, and reconfigure your tree."

        continue-on-error: true

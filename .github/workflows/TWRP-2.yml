
name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'

      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'

      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: ''

      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'

      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/lake'

      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false

      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false

      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'lake'

      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_lake'

      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt update && sudo apt upgrade -y

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup SSH Keys
        if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir -p workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"

          git config --global user.name "Nico170420"
          git config --global user.email "b170420nc@gmail.com"

          repo init \
            --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

      - name: Repo Sync
        run: |
          repo sync -j"$(nproc --all)" --force-sync
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # ============================================================
      # FIX SYSTEM_DLKM
      #
      # Locate valid_super_partition_list by its variable name.
      # Do not depend on fixed line numbers or a hard-coded list
      # matching the entire expected partition sequence.
      # ============================================================

      - name: Fix system_dlkm validator
        run: |
          set -eu

          CONFIG="build/make/core/config.mk"

          echo "Checking $CONFIG"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found!"
            exit 1
          fi

          echo "Searching for valid_super_partition_list..."

          grep -n -C 3 'valid_super_partition_list' "$CONFIG" || true

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("build/make/core/config.mk")
          text = path.read_text()

          # Find the variable itself, not a hard-coded partition sequence.
          pattern = re.compile(
              r"(?m)^([ \t]*valid_super_partition_list[ \t]*:=[ \t]*)([^\n]*)$"
          )

          matches = list(pattern.finditer(text))

          if not matches:
              print(
                  "ERROR: valid_super_partition_list assignment "
                  "was not found in config.mk."
              )
              print(
                  "This source revision may define the list elsewhere "
                  "or use a different format."
              )
              sys.exit(1)

          # Patch every direct assignment so duplicate definitions
          # do not leave an unpatched validator in the same file.
          def patch(match):
              value = match.group(2)
              partitions = value.split()

              if "system_dlkm" in partitions:
                  print("system_dlkm already present; skipping this assignment.")
                  return match.group(0)

              updated = value.rstrip() + " system_dlkm"
              print("Adding system_dlkm to valid_super_partition_list.")
              return match.group(1) + updated

          updated_text = pattern.sub(patch, text)

          if updated_text == text:
              print("No changes were needed.")
          else:
              path.write_text(updated_text)
              print("Successfully patched config.mk.")

          # Verify the result.
          verified = path.read_text()
          assignments = list(pattern.finditer(verified))

          if not assignments:
              print("ERROR: Could not verify the partition-list assignment.")
              sys.exit(1)

          missing = [
              match.group(2).split()
              for match in assignments
              if "system_dlkm" not in match.group(2).split()
          ]

          if missing:
              print(
                  "ERROR: At least one direct assignment still lacks "
                  "system_dlkm."
              )
              sys.exit(1)

          print("Verification passed for direct assignments.")
          PY

          echo ""
          echo "Updated partition-list definition:"
          grep -n -C 3 'valid_super_partition_list' "$CONFIG"

      - name: Clone device tree
        run: |
          git clone \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "./${{ github.event.inputs.DEVICE_PATH }}"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Clone common tree
        if: |
          github.event.inputs.COMMON_TREE_URL != null &&
          github.event.inputs.COMMON_PATH != null &&
          github.event.inputs.COMMON_TREE_URL != '' &&
          github.event.inputs.COMMON_PATH != ''
        run: |
          git clone \
            "${{ github.event.inputs.COMMON_TREE_URL }}" \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "./${{ github.event.inputs.COMMON_PATH }}"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Check Build Tree
        uses: haya14busa/action-cond@v1
        id: buildtree
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: twrp
          if_false: omni

      - name: Sync Device Dependencies
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/convert.sh" \
            "${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"

          repo sync -j"$(nproc --all)"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        continue-on-error: true

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building recovery
        run: |
          set -e

          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${{ github.event.inputs.MAKEFILE_NAME }}-eng"

          make clean

          make "${{ github.event.inputs.BUILD_TARGET }}image" \
            -j"$(nproc --all)"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Build target: ${{ github.event.inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
